<html>
<head>
    <title>HtmlTableLoadOption Sample</title>
    <style>
        table { border-collapse: collapse; margin-bottom: 10px; }
        td { border: 1px solid #999; padding: 4px 8px; }
    </style>
</head>
<body>
    <table id="id1">
        <tr><td>111aaa</td><td>111bbb</td><td>111ccc</td></tr>
    </table>

    <table id="id2">
        <tr><td>222aaa</td><td>222bbb</td><td>222ccc</td></tr>
    </table>

    <table id="id3">
        <tr><td>333aaa</td><td>333bbb</td><td>333ccc</td></tr>
        <tr><td>333aaa-2</td><td>333bbb-2</td><td>333ccc-2</td></tr>
    </table>

    <table id="id4">
        <tr><td>444aaa</td><td>444bbb</td><td>444ccc</td></tr>
        <tr><td>444aaa-2</td><td>444bbb-2</td><td>444ccc-2</td></tr>
    </table>

    <table id="id5">
        <tr><td>555aaa</td><td>555bbb</td><td>555ccc</td></tr>
        <tr><td>555aaa-2</td><td>555bbb-2</td><td>555ccc-2</td></tr>
        <tr><td>555aaa-3</td><td>555bbb-3</td><td>555ccc-3</td></tr>
    </table>

    <table id="id6">
        <tr><td>666aaa</td><td>666bbb</td><td>666ccc</td></tr>
    </table>
</body>
</html>
